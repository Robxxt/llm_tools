<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CV Form Filler</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --ok: #059669;
      --err: #dc2626;
      --warn: #b45309;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --surface: #111827;
        --border: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #818cf8;
        --accent-hover: #a5b4fc;
        --accent-soft: #1e1b4b;
        --ok: #34d399;
        --err: #f87171;
        --warn: #fbbf24;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 368px; margin: 0; padding: 14px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 13px; color: var(--text); background: var(--bg);
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
      font-size: 15px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, var(--accent), #22d3ee);
    }
    h1 { font-size: 14px; margin: 0; letter-spacing: -0.01em; }
    .sub { margin: 1px 0 0; color: var(--muted); font-size: 11px; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 15px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
    }
    .icon-btn:hover { border-color: var(--accent); }

    .status {
      margin: 12px 0; padding: 9px 11px; border-radius: 10px; font-size: 12px;
      border: 1px solid var(--border); background: var(--surface); color: var(--muted);
      min-height: 18px; line-height: 1.4;
    }
    .status:empty { display: none; }
    .status.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); }
    .status.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--border)); }
    .status.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--border)); }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      font: inherit; font-weight: 600; padding: 10px 12px; border-radius: 10px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      transition: transform .1s ease, background .2s ease, border-color .2s ease;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }

    .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .summary { color: var(--muted); font-size: 11.5px; }
    .link-btn {
      border: none; background: transparent; padding: 2px 4px; color: var(--accent);
      font-size: 11.5px; text-decoration: underline; cursor: pointer;
    }

    .debug { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .debug.hidden { display: none; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid var(--border); padding: 5px 6px; vertical-align: top; }
    th { background: var(--surface); text-align: left; font-size: 11px; color: var(--muted); position: sticky; top: 0; }
    #fields { max-height: 260px; overflow: auto; }
    #fields input[type="text"], #fields textarea {
      width: 100%; padding: 5px 7px; font: inherit; font-size: 12px; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    }
    #fields textarea { min-height: 50px; resize: vertical; line-height: 1.4; }
    #fields input[type="checkbox"] { margin-top: 3px; accent-color: var(--accent); }
    .req { color: var(--err); font-weight: 700; }
    .skip, .dropped { padding: 8px 10px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--border); }
    .dropped { color: var(--err); }
    .skip ul { margin: 4px 0 0; padding-left: 16px; }
    .skip li { margin: 2px 0; }
    .foot { margin: 12px 0 0; color: var(--muted); font-size: 11px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">CV</div>
      <div>
        <h1>CV Form Filler</h1>
        <p class="sub">Verbatim autofill from your CV</p>
      </div>
    </div>
    <button id="settings" class="icon-btn" type="button" title="Open backend settings" aria-label="Open backend settings">⚙</button>
  </header>

  <div id="status" class="status" role="status"></div>

  <div class="actions">
    <button id="scan" class="primary" type="button">Scan this page</button>
    <button id="fill" class="primary" type="button" disabled>Fill form</button>
  </div>

  <div class="meta">
    <span id="summary" class="summary">No page scanned yet.</span>
    <button id="debugToggle" class="link-btn" type="button" aria-expanded="false">Show fields</button>
  </div>

  <div id="debug" class="debug hidden">
    <div id="fields"></div>
    <div id="skipped"></div>
    <div id="dropped"></div>
  </div>

  <p class="foot">Nothing is submitted automatically — review, then submit yourself.</p>

  <script src="verbatim.js"></script>
  <script src="content.js"></script>
  <script src="popup.js"></script>
</body>
</html>
